[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.1.0"
description = "Bare-minimum Streamlit LLM router using OpenAI models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain[openai]>=1.1.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llm_router"]

[tool.coverage.report]
show_missing = true
skip_covered = true
